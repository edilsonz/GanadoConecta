<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1299px" height="790px" viewBox="-0.5 -0.5 1299 790"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="titulo"><g><rect x="21" y="19.5" width="1236" height="43" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#173f30" font-family="&quot;Arial&quot;" font-weight="bold" font-size="34px" style="fill: light-dark(rgb(23, 63, 48), rgb(165, 199, 186));"><text x="20.5" y="56.5">Flujo · Registro y sincronización offline</text></g></g></g><g data-cell-id="subtitulo"><g><rect x="21" y="71" width="1236" height="21" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#284239" font-family="&quot;Arial&quot;" font-size="17px" style="fill: light-dark(rgb(40, 66, 57), rgb(168, 191, 183));"><text x="20.5" y="88.5">Operaciones admitidas · alta individual, vacunación y eventos sanitarios seleccionados</text></g></g></g><g data-cell-id="encabezado"><g><rect x="21" y="104" width="1236" height="1" fill="#c9ddd0" stroke="none" pointer-events="all" style="fill: light-dark(rgb(201, 221, 208), rgb(39, 56, 45));"/></g></g><g data-cell-id="cliente"><g><rect x="21" y="134" width="1236" height="245" rx="10" ry="10" fill="#f6faf7" stroke="#a7c1b1" stroke-width="1.5" stroke-dasharray="4.5 4.5" pointer-events="all" style="fill: light-dark(rgb(246, 250, 247), rgb(20, 24, 21)); stroke: light-dark(rgb(167, 193, 177), rgb(60, 83, 69));"/></g></g><g data-cell-id="cliente-titulo"><g><rect x="39" y="147" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#284239" font-family="&quot;Arial&quot;" font-weight="bold" font-size="16px" style="fill: light-dark(rgb(40, 66, 57), rgb(168, 191, 183));"><text x="38.5" y="163.5">Navegador · PWA, contexto local y coordinador de sincronización</text></g></g></g><g data-cell-id="preparar"><g><rect x="44" y="216" width="338" height="111" rx="9" ry="9" fill="#e2f1e9" stroke="#51826b" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(226, 241, 233), rgb(24, 37, 30)); stroke: light-dark(rgb(81, 130, 107), rgb(104, 146, 126));"/></g><g data-cell-id="preparar-titulo"><g><rect x="58" y="228" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="248">1 · Preparar con conexión</text></g></g></g><g data-cell-id="preparar-detalle"><g><rect x="58" y="268.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="285">Validar membresía de escritura.</text></g></g></g><g data-cell-id="preparar-detalle-l1"><g><rect x="58" y="288.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="305">Contexto local hasta 168 horas.</text></g></g></g></g><g data-cell-id="local"><g><rect x="470" y="216" width="338" height="111" rx="9" ry="9" fill="#eaf0fa" stroke="#6a85a9" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(234, 240, 250), rgb(27, 32, 41)); stroke: light-dark(rgb(106, 133, 169), rgb(105, 128, 159));"/></g><g data-cell-id="local-titulo"><g><rect x="484" y="228" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="248">2 · Guardar como pendiente</text></g></g></g><g data-cell-id="local-detalle"><g><rect x="484" y="268.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="285">IndexedDB V3, ámbito por cuenta</text></g></g></g><g data-cell-id="local-detalle-l1"><g><rect x="484" y="288.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="305">y ganadería, IDs y datos originales.</text></g></g></g></g><g data-cell-id="enviar"><g><rect x="896" y="216" width="338" height="111" rx="9" ry="9" fill="#e2f1e9" stroke="#51826b" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(226, 241, 233), rgb(24, 37, 30)); stroke: light-dark(rgb(81, 130, 107), rgb(104, 146, 126));"/></g><g data-cell-id="enviar-titulo"><g><rect x="910" y="228" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="248">3 · Recuperar conexión</text></g></g></g><g data-cell-id="enviar-detalle"><g><rect x="910" y="258.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="275">Sesión y membresía vigentes.</text></g></g></g><g data-cell-id="enviar-detalle-l1"><g><rect x="910" y="278.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="295">Envío manual o automático voluntario,</text></g></g></g><g data-cell-id="enviar-detalle-l2"><g><rect x="910" y="298.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="315">con Web Locks y lease recuperable.</text></g></g></g></g><g data-cell-id="preparar-local"><g><path d="M 382 271.5 L 460.82 271.5" fill="none" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/><path d="M 468.32 271.5 L 460.82 275.25 L 460.82 267.75 Z" fill="#4f7364" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(79, 115, 100), rgb(122, 153, 140)); stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/></g></g><g data-cell-id="local-enviar"><g><path d="M 808 271.5 L 886.82 271.5" fill="none" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/><path d="M 894.32 271.5 L 886.82 275.25 L 886.82 267.75 Z" fill="#4f7364" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(79, 115, 100), rgb(122, 153, 140)); stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/></g></g><g data-cell-id="api"><g><rect x="896" y="453" width="338" height="111" rx="9" ry="9" fill="#d2ebdf" stroke="#376c54" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(210, 235, 223), rgb(24, 46, 36)); stroke: light-dark(rgb(55, 108, 84), rgb(121, 167, 146));"/></g><g data-cell-id="api-titulo"><g><rect x="910" y="465" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="485">4 · Autorizar en la API</text></g></g></g><g data-cell-id="api-detalle"><g><rect x="910" y="505.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="522">HTTPS, JWT, CSRF y membresía.</text></g></g></g><g data-cell-id="api-detalle-l1"><g><rect x="910" y="525.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="909.5" y="542">Revalidación dentro de la transacción.</text></g></g></g></g><g data-cell-id="db"><g><rect x="470" y="453" width="338" height="111" rx="9" ry="9" fill="#eaf0fa" stroke="#6a85a9" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(234, 240, 250), rgb(27, 32, 41)); stroke: light-dark(rgb(106, 133, 169), rgb(105, 128, 159));"/></g><g data-cell-id="db-titulo"><g><rect x="484" y="465" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="485">5 · Confirmar en PostgreSQL</text></g></g></g><g data-cell-id="db-detalle"><g><rect x="484" y="505.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="522">Escritura y comprobante idempotente.</text></g></g></g><g data-cell-id="db-detalle-l1"><g><rect x="484" y="525.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#192f4b" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(25, 47, 75), rgb(183, 202, 226));"><text x="483.5" y="542">Reintento conserva IDs y payload.</text></g></g></g></g><g data-cell-id="confirmar"><g><rect x="44" y="453" width="338" height="111" rx="9" ry="9" fill="#e2f1e9" stroke="#51826b" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(226, 241, 233), rgb(24, 37, 30)); stroke: light-dark(rgb(81, 130, 107), rgb(104, 146, 126));"/></g><g data-cell-id="confirmar-titulo"><g><rect x="58" y="465" width="310" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-weight="bold" font-size="19px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="485">6 · Validar comprobante local</text></g></g></g><g data-cell-id="confirmar-detalle"><g><rect x="58" y="505.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="522">APLICADO o REPROCESADO válido.</text></g></g></g><g data-cell-id="confirmar-detalle-l1"><g><rect x="58" y="525.5" width="310" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#123e30" font-family="&quot;Arial&quot;" font-size="16px" style="fill: light-dark(rgb(18, 62, 48), rgb(164, 202, 190));"><text x="57.5" y="542">Se guarda el recibo y cambia el estado.</text></g></g></g></g><g data-cell-id="enviar-api"><g><path d="M 1065 327 L 1065 443.82" fill="none" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/><path d="M 1065 451.32 L 1061.25 443.82 L 1068.75 443.82 Z" fill="#4f7364" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(79, 115, 100), rgb(122, 153, 140)); stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/></g><g><g fill="#2b4a3e" font-family="&quot;Arial&quot;" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(43, 74, 62), rgb(160, 186, 176));"><rect fill="#ffffff" stroke="none" x="1017" y="378" width="97" height="18" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="1064.5" y="391.5">REST / HTTPS</text></g></g></g><g data-cell-id="api-db"><g><path d="M 896 508.5 L 817.18 508.5" fill="none" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/><path d="M 809.68 508.5 L 817.18 504.75 L 817.18 512.25 Z" fill="#4f7364" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(79, 115, 100), rgb(122, 153, 140)); stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/></g></g><g data-cell-id="db-local"><g><path d="M 470 508.5 L 391.18 508.5" fill="none" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/><path d="M 383.68 508.5 L 391.18 504.75 L 391.18 512.25 Z" fill="#4f7364" stroke="#4f7364" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(79, 115, 100), rgb(122, 153, 140)); stroke: light-dark(rgb(79, 115, 100), rgb(122, 153, 140));"/></g></g><g data-cell-id="incidencias"><g><rect x="21" y="626" width="1236" height="21" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#284239" font-family="&quot;Arial&quot;" font-size="17px" style="fill: light-dark(rgb(40, 66, 57), rgb(168, 191, 183));"><text x="20.5" y="643.5">Recuperación: red y 5xx conservan pendientes. Sesión vencida requiere autenticación. Permisos insuficientes bloquean el ámbito.</text></g></g></g><g data-cell-id="incidencias-l1"><g><rect x="21" y="647" width="1236" height="21" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#284239" font-family="&quot;Arial&quot;" font-size="17px" style="fill: light-dark(rgb(40, 66, 57), rgb(168, 191, 183));"><text x="20.5" y="664.5">Validación y conflicto requieren revisión. Si falla guardar el recibo, la operación aún no queda confirmada localmente.</text></g></g></g><g data-cell-id="pie-linea"><g><rect x="21" y="717" width="1236" height="1" fill="#c9ddd0" stroke="none" pointer-events="all" style="fill: light-dark(rgb(201, 221, 208), rgb(39, 56, 45));"/></g></g><g data-cell-id="pie"><g><rect x="21" y="729.5" width="1236" height="19" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#284239" font-family="&quot;Arial&quot;" font-size="15px" style="fill: light-dark(rgb(40, 66, 57), rgb(168, 191, 183));"><text x="20.5" y="745">El Service Worker precacha recursos estáticos. Las API privadas siguen en red y el alcance offline no incluye ventas ni campañas.</text></g></g></g></g></g></g></svg>