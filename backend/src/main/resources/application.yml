spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: ganadoconecta
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
logging:
  level:
    root: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
ganadoconecta:
  seguridad:
    origen-permitido: ${GANADOCONECTA_ORIGEN_PERMITIDO:http://127.0.0.1:5173}
    jwt:
      clave-publica: ${GANADOCONECTA_JWT_PUBLIC_KEY_PATH}
      clave-privada: ${GANADOCONECTA_JWT_PRIVATE_KEY_PATH}
      emisor: ${GANADOCONECTA_JWT_ISSUER:ganadoconecta-api}
      audiencia: ${GANADOCONECTA_JWT_AUDIENCE:ganadoconecta-web}
    registro:
      max-intentos: ${REGISTRO_MAX_INTENTOS:10}
      ventana: ${REGISTRO_VENTANA:15m}
      max-origenes: ${REGISTRO_MAX_ORIGENES:10000}
