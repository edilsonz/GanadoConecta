name: Integración continua

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:jest:coverage
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:8.4.6-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: ganadoconecta_e2e_ci
          POSTGRES_USER: sprint_ci
          POSTGRES_PASSWORD: sprint_ci_sintetica
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U sprint_ci -d ganadoconecta_e2e_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      POSTGRES_PORT: '5433'
      POSTGRES_DB: ganadoconecta_e2e_ci
      POSTGRES_USER: sprint_ci
      POSTGRES_PASSWORD: sprint_ci_sintetica
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -Dganadoconecta.postgres.integration-test=true -Dganadoconecta.redis.integration-test=true verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pruebas-cobertura-java
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/site/jacoco/

  ia:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: servicio-ia
    env:
      COVERAGE_FILE: coverage/python/.coverage
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: |
            servicio-ia/requirements.txt
            servicio-ia/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - name: Contrato, adaptador y cobertura sin ejecutar un modelo
        run: |
          mkdir -p coverage/python
          python -m coverage run --branch --source=ganadoconecta_ia -m unittest discover -s tests -v
          python -m coverage report -m
          python -m coverage json -o coverage/python/coverage.json
          python -m coverage xml -o coverage/python/coverage.xml
          python -m ganadoconecta_ia.exportar_openapi > coverage/python/openapi-interno.json
          python -m openapi_spec_validator coverage/python/openapi-interno.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cobertura-openapi-python
          path: |
            servicio-ia/coverage/python/*.json
            servicio-ia/coverage/python/*.xml
